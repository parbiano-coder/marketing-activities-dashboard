<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마케팅 활동 모니터링 대시보드</title>
<meta name="description" content="국내 IT서비스·디지털금융 기업의 행사·전시·웨비나·신제품 출시·언론보도·고객사례 등 마케팅 활동을 자동으로 모아 분석하는 대시보드" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>마케팅 활동 모니터링 대시보드</h1>
      <p class="subtitle">IT서비스·디지털금융 기업의 행사·전시·웨비나·신제품 출시·언론보도·고객사례를 자동으로 모아 분석합니다.</p>
      <p class="updated-at" id="updatedAt">불러오는 중...</p>

      <div class="stat-row" id="statRow"></div>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <input type="search" id="searchInput" placeholder="제목/슬로건/키메시지 검색..." aria-label="검색" />
      <div class="filters" id="categoryFilters" role="group" aria-label="카테고리별 필터"></div>
      <div class="filters" id="companyFilters" role="group" aria-label="기업별 필터"></div>
      <div class="filters" id="typeFilters" role="group" aria-label="활동 유형별 필터"></div>
      <button type="button" id="anomalyToggle" class="anomaly-toggle" aria-pressed="false">
        <span class="dot"></span> 특이 활동만 보기
      </button>
    </div>

    <p class="status-message" id="statusMessage" hidden></p>

    <ul class="activity-list" id="activityList"></ul>
  </main>

  <footer class="site-footer">
    <p>
      이 대시보드는 Google 뉴스 및 각사 공식 뉴스룸을 매일 자동 수집하고, Google Gemini로 슬로건·핵심 메시지·특이점을
      분석해 생성됩니다. 원문 저작권은 각 언론사/기업에 있습니다.
    </p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
