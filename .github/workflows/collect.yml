name: Collect Marketing Activities

on:
  schedule:
    - cron: "0 21 * * *" # 매일 1회 (UTC 21:00 = 한국시간 익일 오전 6시경)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-activities
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run collect

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activities.json
          git diff --cached --quiet || git commit -m "chore: update marketing activities data"
          git push
